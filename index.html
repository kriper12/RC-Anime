<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlossomFlix • Romance & Comedy Anime</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" />
            <stop offset="1" />
          </linearGradient>
        </defs>
        <circle cx="32" cy="32" r="30" fill="url(#g)"/>
        <path d="M17 32c8-12 22-12 30 0-8 12-22 12-30 0z" fill="white" opacity="0.9"/>
        <circle cx="26" cy="28" r="3" fill="white"/>
        <circle cx="38" cy="28" r="3" fill="white"/>
      </svg>
      <span class="brand-name">BlossomFlix</span>
    </div>

    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="Search Romance & Rom‑Com Anime…" aria-label="Search anime" />
      <button id="clearSearch" class="icon-btn" aria-label="Clear search" title="Clear">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <nav class="user-actions">
      <button id="favoritesBtn" class="pill">Favorites</button>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 108.94 7.06A7 7 0 0112 3z" stroke="currentColor" fill="none" stroke-width="2"/></svg>
      </button>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-slide current" style="--bg:url('https://images.unsplash.com/photo-1520975922039-b37c6cf9ef10?q=80&w=1600&auto=format&fit=crop');">
      <div class="overlay"></div>
      <div class="hero-content">
        <h1>Soft Hearts, Big Laughs</h1>
        <p>Hand‑picked Romance & Comedy Anime To Brighten Your Queue.</p>
        <button class="cta" data-hero-play>Watch Something Cute</button>
      </div>
    </div>
    <div class="hero-slide" style="--bg:url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1600&auto=format&fit=crop');">
      <div class="overlay"></div>
      <div class="hero-content">
        <h1>Meet‑Cute Marathons</h1>
        <p>From Awkward Confessions To Over‑The‑Top Pranks.</p>
        <button class="cta" data-hero-play>Shuffle Play</button>
      </div>
    </div>
    <div class="dots" role="tablist" aria-label="Hero slides">
      <button class="dot active" aria-label="Slide 1"></button>
      <button class="dot" aria-label="Slide 2"></button>
    </div>
  </section>

  <section class="filters" aria-label="Filters">
    <div class="pill-group" role="tablist" aria-label="Genres">
      <button class="pill active" data-filter="all">All</button>
      <button class="pill" data-filter="Romance">Romance</button>
      <button class="pill" data-filter="Rom‑Com">Rom‑Com</button>
      <button class="pill" data-filter="School">School</button>
      <button class="pill" data-filter="Slice‑Of‑Life">Slice‑Of‑Life</button>
      <button class="pill" data-filter="Shoujo">Shoujo</button>
    </div>
    <div class="sort-wrap">
      <label for="sortSelect">Sort</label>
      <select id="sortSelect" aria-label="Sort anime">
        <option value="trending">Trending</option>
        <option value="az">A → Z</option>
        <option value="rating">Rating</option>
        <option value="new">Newest</option>
      </select>
    </div>
  </section>

  <main class="content">
    <section>
      <h2 class="section-title">Featured Rom‑Coms</h2>
      <div id="grid" class="grid" aria-live="polite"></div>
    </section>

    <section>
      <h2 class="section-title">Recently Added</h2>
      <div id="recentGrid" class="grid small" aria-live="polite"></div>
    </section>
  </main>

  <dialog id="playerModal" class="player-modal" aria-label="Player">
    <div class="player-shell">
      <button class="close-btn" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="player">
        <iframe id="playerFrame" title="BlossomFlix Player" loading="lazy" allowfullscreen></iframe>
      </div>
      <div class="meta">
        <h3 id="playerTitle"></h3>
        <p id="playerDesc"></p>
      </div>
    </div>
  </dialog>

  <footer class="site-footer">
    <p>© <span id="year"></span> BlossomFlix — A Demo Front‑End For Romance & Comedy Anime.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
