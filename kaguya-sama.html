<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaguya-sama: Love Is War | BlossomFlix</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <!-- Stylish Header -->
  <header class="header-banner">
    <div class="header-content">
      <a href="index.html" class="back-btn">← Back To Home</a>
      <h1 class="player-title">Kaguya-sama: Love Is War</h1>
      <button id="themeToggle" class="theme-toggle">🌙</button>
    </div>
  </header>

  <!-- Player Page Content -->
  <main class="player-page">
    <!-- Video Player -->
    <div class="player-container">
      <iframe id="animePlayer" src="https://www.youtube.com/embed/HbH2c6NqxaQ" allowfullscreen></iframe>
    </div>

    <!-- Episode Buttons -->
    <div class="episode-card">
      <h2 class="episode-heading">Episodes</h2>
      <div class="episode-selector">
        <button class="episode-btn active" data-ep="https://www.youtube.com/embed/HbH2c6NqxaQ">Episode 1</button>
        <button class="episode-btn" data-ep="https://www.youtube.com/embed/2S4jlVqg8j8">Episode 2</button>
        <button class="episode-btn" data-ep="https://www.youtube.com/embed/Jv4s_RsOq1U">Episode 3</button>
        <button class="episode-btn" data-ep="https://www.youtube.com/embed/jL5rN49r6gw">Episode 4</button>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    // === Episode Button Logic ===
    const episodeBtns = document.querySelectorAll(".episode-btn");
    const player = document.getElementById("animePlayer");

    episodeBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        // Change iFrame Source
        const epLink = btn.getAttribute("data-ep");
        player.src = epLink;

        // Update Active Button
        episodeBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
      });
    });
  </script>
</body>
</html>
